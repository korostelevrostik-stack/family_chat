<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <title>Семейный чат</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0b141a; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #app { width: 100%; max-width: 500px; height: 700px; background: #1e2a32; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
    #header { background: #2a3942; padding: 15px; color: white; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #3b4a54; }
    #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #2a3942; padding: 10px 14px; border-radius: 12px; max-width: 80%; color: #e9edef; word-wrap: break-word; }
    .msg .name { font-weight: bold; color: #00a884; font-size: 14px; }
    .msg .time { font-size: 11px; color: #8696a0; margin-left: 10px; }
    .msg.me { align-self: flex-end; background: #005c4b; }
    #form { display: flex; gap: 8px; padding: 12px; background: #1e2a32; border-top: 1px solid #3b4a54; }
    #input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #2a3942; color: white; outline: none; }
    #input::placeholder { color: #8696a0; }
    #btn { padding: 12px 20px; border-radius: 25px; border: none; background: #00a884; color: white; font-weight: bold; cursor: pointer; }
    #login { padding: 20px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; }
    #login input { padding: 14px; border-radius: 12px; border: none; background: #2a3942; color: white; font-size: 16px; }
    #login button { padding: 14px; border-radius: 12px; border: none; background: #00a884; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">💬 Семейный чат</div>
  
  <div id="login">
    <input id="nameInput" placeholder="Введите ваше имя (например, Папа)" />
    <button id="joinBtn">Войти в чат</button>
  </div>

  <div id="chat" class="hidden" style="flex-direction: column; height: 100%;">
    <div id="messages"></div>
    <div id="form">
      <input id="input" placeholder="Сообщение..." />
      <button id="btn">➤</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let userName = '';

  const loginDiv = document.getElementById('login');
  const chatDiv = document.getElementById('chat');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');

  joinBtn.addEventListener('click', () => {
    userName = nameInput.value.trim() || 'Аноним';
    loginDiv.classList.add('hidden');
    chatDiv.classList.remove('hidden');
    chatDiv.style.display = 'flex';
    document.getElementById('header').textContent = `💬 ${userName}`;
    input.focus();
  });

  function addMessage(name, text, time) {
    const div = document.createElement('div');
    div.className = 'msg' + (name === userName ? ' me' : '');
    div.innerHTML = `<span class="name">${name}</span> <span class="time">${time}</span><br>${text}`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  socket.on('history', (data) => {
    data.forEach(msg => addMessage(msg.name, msg.text, msg.time));
  });

  socket.on('newMessage', (data) => {
    addMessage(data.name, data.text, data.time);
  });

  btn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  function send() {
    const text = input.value.trim();
    if (!text || !userName) return;
    socket.emit('sendMessage', { name: userName, text });
    input.value = '';
    input.focus();
  }

  // Регистрация Service Worker для PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('SW зарегистрирован'));
  }
</script>
</body>
</html>
