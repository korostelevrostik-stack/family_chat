<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный чат</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    #app { width: 100%; max-width: 500px; height: 700px; background: #0f1419; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 24px; }

    #header { background: #1f2b33; padding: 12px 16px; color: white; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2b3a45; min-height: 60px; flex-shrink: 0; z-index: 10; }
    #header .back { background: none; border: none; color: #6b8c9e; font-size: 24px; cursor: pointer; padding: 0 8px; display: none; line-height: 1; }
    #header .avatar { width: 38px; height: 38px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; flex-shrink: 0; }
    #header .info { flex: 1; overflow: hidden; }
    #header .info .name { font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #header .info .status { font-size: 13px; color: #6b8c9e; }
    #header .menu-btn { background: none; border: none; color: #6b8c9e; font-size: 22px; cursor: pointer; padding: 0 4px; }

    #loginScreen { display: flex; flex-direction: column; justify-content: center; padding: 30px 24px; height: 100%; background: #0f1419; }
    #loginScreen h1 { color: white; font-size: 24px; text-align: center; margin-bottom: 20px; }
    #loginScreen input { padding: 14px 18px; border-radius: 14px; border: none; background: #1f2b33; color: white; font-size: 16px; outline: none; margin-bottom: 10px; }
    #loginScreen input::placeholder { color: #6b8c9e; }
    #loginScreen button { padding: 14px; border-radius: 14px; border: none; background: #2b5278; color: white; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    #loginScreen .switch { color: #6b8c9e; text-align: center; margin-top: 12px; font-size: 14px; }
    #loginScreen .switch span { color: #2b5278; font-weight: 600; cursor: pointer; }
    #loginScreen .error { color: #ff6b6b; font-size: 14px; text-align: center; margin-top: 8px; }

    #loadingScreen { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: #0f1419; color: #6b8c9e; font-size: 16px; }
    #loadingScreen.active { display: flex; }
    .spinner { width: 40px; height: 40px; border: 4px solid #1f2b33; border-top: 4px solid #2b5278; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #contactsScreen { display: none; flex-direction: column; height: 100%; background: #0f1419; }
    #contactsScreen.active { display: flex; }
    #contactsList { flex: 1; overflow-y: auto; padding: 8px 0; }
    .contact-item { padding: 12px 20px; border-bottom: 1px solid #1f2b33; color: white; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background 0.15s; }
    .contact-item:active { background: #1f2b33; }
    .contact-item .avatar { width: 48px; height: 48px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: white; flex-shrink: 0; position: relative; }
    .contact-item .avatar .online { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0f1419; }
    .contact-item .avatar .online.on { background: #2b9b5e; }
    .contact-item .avatar .online.off { background: #6b8c9e; }
    .contact-item .info { flex: 1; min-width: 0; }
    .contact-item .info .name { font-weight: 500; font-size: 16px; }
    .contact-item .info .last-msg { font-size: 13px; color: #6b8c9e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #chatScreen { display: none; flex-direction: column; height: 100%; background: #0f1419; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; background: #0f1419; }
    #chatScreen.active { display: flex; }
    #messagesContainer { flex: 1; padding: 12px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; background: #0f1419; }
    .msg { max-width: 80%; padding: 8px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4; word-wrap: break-word; margin-bottom: 2px; }
    .msg.me { align-self: flex-end; background: #2b5278; color: white; border-bottom-right-radius: 4px; }
    .msg.them { align-self: flex-start; background: #1f2b33; color: #e1e9f0; border-bottom-left-radius: 4px; }
    .msg .time { font-size: 10px; color: #6b8c9e; display: block; text-align: right; margin-top: 2px; }

    #inputArea { display: flex; gap: 8px; padding: 10px 16px; background: #1f2b33; border-top: 1px solid #2b3a45; flex-shrink: 0; align-items: center; }
    #inputArea input { flex: 1; padding: 10px 16px; border-radius: 24px; border: none; background: #2b3a45; color: white; font-size: 16px; outline: none; }
    #inputArea input::placeholder { color: #6b8c9e; }
    #inputArea button { padding: 10px 18px; border-radius: 24px; border: none; background: #2b5278; color: white; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.15s; flex-shrink: 0; }
    #inputArea button:active { transform: scale(0.95); }

    #emojiPanel { display: none; background: #1f2b33; border-top: 1px solid #2b3a45; padding: 8px 12px; flex-wrap: wrap; gap: 4px; max-height: 150px; overflow-y: auto; justify-content: center; }
    #emojiPanel button { background: none; border: none; font-size: 28px; cursor: pointer; padding: 4px 6px; border-radius: 8px; transition: 0.15s; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
    #emojiPanel button:hover { background: #2b3a45; }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <button class="back" id="backBtn">←</button>
    <div class="avatar" id="headerAvatar">👤</div>
    <div class="info">
      <div class="name" id="headerName">Семейный чат</div>
      <div class="status" id="headerStatus">онлайн</div>
    </div>
    <button class="menu-btn" id="menuBtn">⚙️</button>
  </div>

  <!-- Экран загрузки (показывается при автовходе) -->
  <div id="loadingScreen" class="active">
    <div class="spinner"></div>
    <div>Входим в аккаунт...</div>
  </div>

  <!-- Экран входа -->
  <div id="loginScreen" style="display:none;">
    <h1 id="authTitle">💬 Вход</h1>
    <input id="loginInput" placeholder="Логин (например, papa)" />
    <input id="passInput" type="password" placeholder="Пароль" />
    <input id="nameInput" placeholder="Отображаемое имя" style="display:none;" />
    <button id="authBtn">Войти</button>
    <div class="switch" id="authSwitch">Нет аккаунта? <span>Зарегистрироваться</span></div>
    <div class="error" id="authError"></div>
  </div>

  <div id="contactsScreen">
    <div id="contactsList"></div>
  </div>

  <div id="chatScreen">
    <div id="messagesContainer"></div>
    <div id="emojiPanel"></div>
    <div id="inputArea">
      <button id="emojiBtn" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6b8c9e;padding:4px 8px;">😊</button>
      <input id="msgInput" placeholder="Сообщение..." />
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ============================================================
  //  ЧАТ С АВТОВХОДОМ
  // ============================================================

  const socket = io();

  let myLogin = '';
  let myName = '';
  let currentChatLogin = '';
  let isRegisterMode = false;
  let allUsers = [];

  // ===== LOCALSTORAGE =====
  const Storage = {
    KEY: 'family_chat_user',
    save(login, password, name) {
      try {
        localStorage.setItem(this.KEY, JSON.stringify({ login, password, name }));
      } catch (e) {}
    },
    load() {
      try {
        const data = localStorage.getItem(this.KEY);
        return data ? JSON.parse(data) : null;
      } catch (e) { return null; }
    },
    clear() {
      localStorage.removeItem(this.KEY);
    }
  };

  // ===== DOM =====
  const loadingScreen = document.getElementById('loadingScreen');
  const loginScreen = document.getElementById('loginScreen');
  const contactsScreen = document.getElementById('contactsScreen');
  const chatScreen = document.getElementById('chatScreen');
  const contactsList = document.getElementById('contactsList');
  const messagesContainer = document.getElementById('messagesContainer');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const backBtn = document.getElementById('backBtn');
  const menuBtn = document.getElementById('menuBtn');
  const headerName = document.getElementById('headerName');
  const headerStatus = document.getElementById('headerStatus');
  const headerAvatar = document.getElementById('headerAvatar');
  const loginInput = document.getElementById('loginInput');
  const passInput = document.getElementById('passInput');
  const nameInput = document.getElementById('nameInput');
  const authBtn = document.getElementById('authBtn');
  const authTitle = document.getElementById('authTitle');
  const authError = document.getElementById('authError');
  const authSwitch = document.getElementById('authSwitch');

  // ===== АВТОВХОД (ГЛАВНОЕ ИСПРАВЛЕНИЕ) =====
  function tryAutoLogin() {
    const saved = Storage.load();
    if (saved && saved.login && saved.password) {
      console.log('🔑 Автовход для:', saved.login);
      // Показываем экран загрузки
      loadingScreen.classList.add('active');
      loginScreen.style.display = 'none';
      // Отправляем логин на сервер
      socket.emit('login', { login: saved.login, password: saved.password });

      // Таймаут: если через 5 секунд не вошли — показываем экран входа
      setTimeout(() => {
        if (loadingScreen.classList.contains('active')) {
          console.log('⚠️ Автовход не удался, показываем экран входа');
          loadingScreen.classList.remove('active');
          loginScreen.style.display = 'flex';
          loginInput.value = saved.login;
          passInput.value = saved.password;
        }
      }, 5000);
    } else {
      // Нет сохранённого аккаунта — показываем экран входа
      console.log('🔓 Нет сохранённого аккаунта');
      loadingScreen.classList.remove('active');
      loginScreen.style.display = 'flex';
    }
  }

  // ===== ПЕРЕКЛЮЧЕНИЕ ВХОД/РЕГИСТРАЦИЯ =====
  authSwitch.addEventListener('click', () => {
    isRegisterMode = !isRegisterMode;
    if (isRegisterMode) {
      authTitle.textContent = '📝 Регистрация';
      authBtn.textContent = 'Зарегистрироваться';
      authSwitch.innerHTML = 'Уже есть аккаунт? <span>Войти</span>';
      nameInput.style.display = 'block';
    } else {
      authTitle.textContent = '💬 Вход';
      authBtn.textContent = 'Войти';
      authSwitch.innerHTML = 'Нет аккаунта? <span>Зарегистрироваться</span>';
      nameInput.style.display = 'none';
    }
    authError.textContent = '';
  });

  // ===== КНОПКА ВХОДА =====
  authBtn.addEventListener('click', () => {
    const login = loginInput.value.trim();
    const password = passInput.value.trim();
    if (!login || !password) { authError.textContent = 'Заполните все поля!'; return; }
    if (isRegisterMode) {
      const name = nameInput.value.trim() || login;
      socket.emit('register', { login, password, name });
    } else {
      socket.emit('login', { login, password });
    }
  });

  // ===== ОТВЕТЫ СЕРВЕРА =====
  socket.on('registerSuccess', (data) => {
    myLogin = data.login;
    myName = data.name;
    // СОХРАНЯЕМ РЕАЛЬНЫЙ ПАРОЛЬ (а не ***)
    Storage.save(data.login, passInput.value, data.name);
    enterApp();
  });

  socket.on('registerError', (msg) => {
    loadingScreen.classList.remove('active');
    loginScreen.style.display = 'flex';
    authError.textContent = msg;
  });

  socket.on('loginSuccess', (data) => {
    myLogin = data.login;
    myName = data.name;
    // СОХРАНЯЕМ РЕАЛЬНЫЙ ПАРОЛЬ
    Storage.save(data.login, passInput.value, data.name);
    enterApp();
  });

  socket.on('loginError', (msg) => {
    // Автовход не удался — показываем экран входа
    loadingScreen.classList.remove('active');
    loginScreen.style.display = 'flex';
    authError.textContent = 'Сессия истекла. Войдите заново.';
    Storage.clear(); // Удаляем неверные данные
  });

  // ===== ВХОД В ПРИЛОЖЕНИЕ =====
  function enterApp() {
    loadingScreen.classList.remove('active');
    loginScreen.style.display = 'none';
    contactsScreen.classList.add('active');
    chatScreen.classList.remove('active');
    headerName.textContent = 'Контакты';
    headerStatus.textContent = '';
    headerAvatar.textContent = '👤';
    backBtn.style.display = 'none';
    socket.emit('getUsers');
  }

  // ===== СПИСОК ПОЛЬЗОВАТЕЛЕЙ =====
  socket.on('userList', (users) => {
    allUsers = users.filter(u => u.login !== myLogin);
    renderContacts();
  });

  socket.on('userJoined', (login) => {
    if (!allUsers.find(u => u.login === login) && login !== myLogin) {
      allUsers.push({ login, name: login, online: true });
      renderContacts();
    }
  });

  socket.on('userLeft', (login) => {
    const user = allUsers.find(u => u.login === login);
    if (user) user.online = false;
    renderContacts();
  });

  function renderContacts() {
    contactsList.innerHTML = '';
    if (allUsers.length === 0) {
      contactsList.innerHTML = `<div style="color:#6b8c9e;text-align:center;padding:40px 20px;">Нет контактов.<br>Пригласите родных!</div>`;
      return;
    }
    allUsers.forEach(user => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      const avatarLetter = user.name.charAt(0).toUpperCase();
      const onlineClass = user.online ? 'on' : 'off';
      div.innerHTML = `
        <div class="avatar">${avatarLetter}<div class="online ${onlineClass}"></div></div>
        <div class="info"><div class="name">${user.name}</div><div class="last-msg">${user.online ? '🟢 онлайн' : '⚪ не в сети'}</div></div>
      `;
      div.addEventListener('click', () => openChat(user.login));
      contactsList.appendChild(div);
    });
  }

  // ===== ОТКРЫТЬ ЧАТ =====
  function openChat(login) {
    currentChatLogin = login;
    const user = allUsers.find(u => u.login === login);
    contactsScreen.classList.remove('active');
    chatScreen.classList.add('active');
    backBtn.style.display = 'block';
    headerName.textContent = user ? user.name : login;
    headerStatus.textContent = user?.online ? '🟢 онлайн' : '⚪ не в сети';
    headerAvatar.textContent = user ? user.name.charAt(0).toUpperCase() : '👤';
    messagesContainer.innerHTML = '';
    socket.emit('getHistory', { withLogin: login });
    msgInput.focus();
  }

  // ===== НАЗАД =====
  backBtn.addEventListener('click', () => {
    currentChatLogin = '';
    chatScreen.classList.remove('active');
    contactsScreen.classList.add('active');
    backBtn.style.display = 'none';
    headerName.textContent = 'Контакты';
    headerStatus.textContent = '';
    headerAvatar.textContent = '👤';
  });

  // ===== МЕНЮ (смена имени + выход) =====
  menuBtn.addEventListener('click', () => {
    const action = prompt('Введите новое имя или "exit" для выхода:', myName);
    if (action === 'exit') {
      Storage.clear();
      location.reload();
      return;
    }
    if (action && action.trim() !== myName) {
      socket.emit('changeName', { newName: action.trim() });
      myName = action.trim();
    }
  });

  // ===== ИСТОРИЯ =====
  socket.on('history', ({ withLogin, messages }) => {
    if (withLogin === currentChatLogin) {
      messagesContainer.innerHTML = '';
      messages.forEach(msg => addMessage(msg.from, msg.text, msg.time));
    }
  });

  // ===== НОВОЕ СООБЩЕНИЕ =====
  socket.on('newPrivateMessage', ({ from, text, time }) => {
    if (currentChatLogin === from || currentChatLogin === myLogin) {
      addMessage(from, text, time);
    }
  });

  function addMessage(from, text, time) {
    const div = document.createElement('div');
    div.className = `msg ${from === myLogin ? 'me' : 'them'}`;
    div.innerHTML = `${text}<span class="time">${time}</span>`;
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // ===== ОТПРАВКА =====
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !currentChatLogin) return;
    socket.emit('sendPrivate', { toLogin: currentChatLogin, text });
    msgInput.value = '';
    msgInput.focus();
  }

  // ===== СМАЙЛИКИ =====
  const emojis = ['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','🥰','😘','😗','😙','😚','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','😡','😠','🤬','😷','🤒','🤕','🤢','🤮','🥴','😇','🤠','🤡','🥳','🥺','😈','👿','👹','👺','💀','☠️','👻','👽','👾','🤖','💩','😺','😸','😹','😻','😼','😽','🙀','😿','😾','🙌','👏','👋','🤝','👍','👎','👊','✊','🤛','🤜','👌','🤌','🤏','✌️','🤞','🤟','🤘','👈','👉','👆','👇','☝️','✋','🤚','🖐️','🖖','👀'];
  const emojiPanel = document.getElementById('emojiPanel');
  const emojiBtn = document.getElementById('emojiBtn');
  emojis.forEach(e => {
    const btn = document.createElement('button');
    btn.textContent = e;
    btn.onclick = () => { msgInput.value += e; msgInput.focus(); emojiPanel.style.display = 'none'; };
    emojiPanel.appendChild(btn);
  });
  emojiBtn.addEventListener('click', () => {
    emojiPanel.style.display = emojiPanel.style.display === 'none' || emojiPanel.style.display === '' ? 'flex' : 'none';
  });

  // ===== ЗАПУСК АВТОВХОДА =====
  tryAutoLogin();

  console.log('✅ Чат загружен!');
</script>
</body>
</html>
