<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный чат</title>
  <style>
    /* ===== ОБЩИЕ СТИЛИ ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    
    #app {
      width: 100%;
      max-width: 500px;
      height: 700px;
      background: #0f1419;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      border-radius: 24px;
    }

    /* ===== ШАПКА ===== */
    #header {
      background: #1f2b33;
      padding: 12px 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2b3a45;
      min-height: 60px;
      flex-shrink: 0;
      z-index: 10;
    }
    #header .back {
      background: none;
      border: none;
      color: #6b8c9e;
      font-size: 24px;
      cursor: pointer;
      padding: 0 8px;
      display: none;
      line-height: 1;
    }
    #header .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #2b5278;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
      flex-shrink: 0;
    }
    #header .info {
      flex: 1;
      overflow: hidden;
    }
    #header .info .name {
      font-weight: 600;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #header .info .status {
      font-size: 13px;
      color: #6b8c9e;
    }
    #header .menu-btn {
      background: none;
      border: none;
      color: #6b8c9e;
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
    }

    /* ===== ЭКРАН ВХОДА ===== */
    #loginScreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 24px;
      height: 100%;
      background: #0f1419;
    }
    #loginScreen h1 {
      color: white;
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    #loginScreen input {
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      background: #1f2b33;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 10px;
    }
    #loginScreen input::placeholder { color: #6b8c9e; }
    #loginScreen button {
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #2b5278;
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    #loginScreen .switch {
      color: #6b8c9e;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }
    #loginScreen .switch span {
      color: #2b5278;
      font-weight: 600;
      cursor: pointer;
    }
    #loginScreen .error {
      color: #ff6b6b;
      font-size: 14px;
      text-align: center;
      margin-top: 8px;
    }
    #loginScreen .saved-info {
      color: #6b8c9e;
      text-align: center;
      font-size: 13px;
      margin-bottom: 10px;
    }

    /* ===== ЭКРАН КОНТАКТОВ ===== */
    #contactsScreen {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #0f1419;
    }
    #contactsScreen.active {
      display: flex;
    }
    #contactsList {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .contact-item {
      padding: 12px 20px;
      border-bottom: 1px solid #1f2b33;
      color: white;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .contact-item:active {
      background: #1f2b33;
    }
    .contact-item .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2b5278;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      color: white;
      flex-shrink: 0;
      position: relative;
    }
    .contact-item .avatar .online {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #0f1419;
    }
    .contact-item .avatar .online.on { background: #2b9b5e; }
    .contact-item .avatar .online.off { background: #6b8c9e; }
    .contact-item .info {
      flex: 1;
      min-width: 0;
    }
    .contact-item .info .name {
      font-weight: 500;
      font-size: 16px;
    }
    .contact-item .info .last-msg {
      font-size: 13px;
      color: #6b8c9e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== ЭКРАН ЧАТА ===== */
    #chatScreen {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #0f1419;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      background: #0f1419;
    }
    #chatScreen.active {
      display: flex;
    }
    #messagesContainer {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #0f1419;
    }
    .msg {
      max-width: 80%;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      margin-bottom: 2px;
    }
    .msg.me {
      align-self: flex-end;
      background: #2b5278;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.them {
      align-self: flex-start;
      background: #1f2b33;
      color: #e1e9f0;
      border-bottom-left-radius: 4px;
    }
    .msg .time {
      font-size: 10px;
      color: #6b8c9e;
      display: block;
      text-align: right;
      margin-top: 2px;
    }

    /* ===== ПАНЕЛЬ ВВОДА ===== */
    #inputArea {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #1f2b33;
      border-top: 1px solid #2b3a45;
      flex-shrink: 0;
    }
    #inputArea input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 24px;
      border: none;
      background: #2b3a45;
      color: white;
      font-size: 16px;
      outline: none;
    }
    #inputArea input::placeholder {
      color: #6b8c9e;
    }
    #inputArea button {
      padding: 10px 18px;
      border-radius: 24px;
      border: none;
      background: #2b5278;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.15s;
    }
    #inputArea button:active {
      transform: scale(0.95);
    }

    /* ===== УТИЛИТЫ ===== */
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">

  <!-- ===== ШАПКА ===== -->
  <div id="header">
    <button class="back" id="backBtn">←</button>
    <div class="avatar" id="headerAvatar">👤</div>
    <div class="info">
      <div class="name" id="headerName">Семейный чат</div>
      <div class="status" id="headerStatus">онлайн</div>
    </div>
    <button class="menu-btn" id="menuBtn">⚙️</button>
  </div>

  <!-- ===== ЭКРАН ВХОДА ===== -->
  <div id="loginScreen">
    <h1 id="authTitle">💬 Вход</h1>
    <input id="loginInput" placeholder="Логин (например, papa)" />
    <input id="passInput" type="password" placeholder="Пароль" />
    <input id="nameInput" placeholder="Отображаемое имя (например, Папа)" style="display:none;" />
    <button id="authBtn">Войти</button>
    <div class="switch" id="authSwitch">Нет аккаунта? <span>Зарегистрироваться</span></div>
    <div class="error" id="authError"></div>
  </div>

  <!-- ===== ЭКРАН КОНТАКТОВ ===== -->
  <div id="contactsScreen" class="active">
    <div id="contactsList"></div>
  </div>

  <!-- ===== ЭКРАН ЧАТА ===== -->
  <div id="chatScreen">
    <div id="messagesContainer"></div>
    <div id="inputArea">
      <input id="msgInput" placeholder="Сообщение..." />
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<!-- ===== ПОДКЛЮЧЕНИЕ СКРИПТОВ ===== -->
<script src="/socket.io/socket.io.js"></script>
<script src="/auth.js"></script>
<script src="/main.js"></script>

</body>
  </html>
