<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <title>Личные чаты</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #app { width: 100%; max-width: 500px; height: 700px; background: #0f1419; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    
    /* Шапка */
    #header { background: #1f2b33; padding: 15px 20px; color: white; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2b3a45; }
    #header .back { background: none; border: none; color: #6b8c9e; font-size: 24px; cursor: pointer; padding: 0 8px; display: none; }
    #header .title { font-weight: 600; font-size: 17px; flex: 1; }
    #header .status { font-size: 13px; color: #6b8c9e; }
    
    /* Список контактов */
    #contacts { flex: 1; padding: 12px 0; overflow-y: auto; }
    .contact { padding: 14px 20px; border-bottom: 1px solid #1f2b33; color: white; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.15s; }
    .contact:active { background: #1f2b33; }
    .contact .avatar { width: 44px; height: 44px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: white; }
    .contact .info { flex: 1; }
    .contact .info .name { font-weight: 500; font-size: 16px; }
    .contact .info .lastMsg { font-size: 13px; color: #6b8c9e; margin-top: 2px; }
    
    /* Окно чата (скрыто) */
    #chatWindow { display: none; flex-direction: column; height: 100%; }
    #messages { flex: 1; padding: 12px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .msg { max-width: 80%; padding: 7px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: #2b5278; color: white; border-bottom-right-radius: 4px; }
    .msg.them { align-self: flex-start; background: #1f2b33; color: #e1e9f0; border-bottom-left-radius: 4px; }
    .msg .time { font-size: 10px; color: #6b8c9e; display: block; text-align: right; margin-top: 2px; }
    
    #form { display: flex; gap: 8px; padding: 10px 16px; background: #1f2b33; border-top: 1px solid #2b3a45; }
    #input { flex: 1; padding: 10px 16px; border-radius: 24px; border: none; background: #2b3a45; color: white; font-size: 16px; outline: none; }
    #input::placeholder { color: #6b8c9e; }
    #btn { padding: 10px 18px; border-radius: 24px; border: none; background: #2b5278; color: white; font-weight: 600; font-size: 16px; cursor: pointer; }
    
    #login { padding: 30px 24px; display: flex; flex-direction: column; gap: 16px; justify-content: center; height: 100%; background: #0f1419; }
    #login h1 { color: white; font-size: 24px; text-align: center; }
    #login input { padding: 14px 18px; border-radius: 14px; border: none; background: #1f2b33; color: white; font-size: 16px; outline: none; }
    #login button { padding: 14px; border-radius: 14px; border: none; background: #2b5278; color: white; font-size: 18px; font-weight: 600; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app">
  <!-- Шапка -->
  <div id="header">
    <button class="back" id="backBtn">←</button>
    <div class="title" id="headerTitle">Контакты</div>
    <div class="status" id="headerStatus"></div>
  </div>

  <!-- Экран входа -->
  <div id="login">
    <h1>💬 Вход в чат</h1>
    <input id="nameInput" placeholder="Введите ваше имя" />
    <button id="joinBtn">Войти</button>
  </div>

  <!-- Список контактов -->
  <div id="contacts" class="hidden"></div>

  <!-- Окно чата -->
  <div id="chatWindow">
    <div id="messages"></div>
    <div id="form">
      <input id="input" placeholder="Сообщение..." />
      <button id="btn">➤</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myName = '';
  let currentChat = '';
  let allUsers = [];

  const loginDiv = document.getElementById('login');
  const contactsDiv = document.getElementById('contacts');
  const chatWindow = document.getElementById('chatWindow');
  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const backBtn = document.getElementById('backBtn');
  const headerTitle = document.getElementById('headerTitle');
  const headerStatus = document.getElementById('headerStatus');

  // Вход
  joinBtn.addEventListener('click', () => {
    myName = nameInput.value.trim() || 'Аноним';
    loginDiv.classList.add('hidden');
    contactsDiv.classList.remove('hidden');
    socket.emit('register', myName);
    headerTitle.textContent = 'Контакты';
  });

  // Обновление списка пользователей
  socket.on('userList', (users) => {
    allUsers = users.filter(u => u !== myName);
    renderContacts();
  });

  socket.on('userJoined', (name) => {
    if (!allUsers.includes(name) && name !== myName) {
      allUsers.push(name);
      renderContacts();
    }
  });

  socket.on('userLeft', (name) => {
    allUsers = allUsers.filter(u => u !== name);
    renderContacts();
  });

  // История сообщений
  socket.on('history', ({ withUser, messages }) => {
    if (withUser === currentChat) {
      messagesDiv.innerHTML = '';
      messages.forEach(msg => addMessage(msg.from, msg.text, msg.time));
    }
  });

  // Новое личное сообщение
  socket.on('newPrivateMessage', ({ from, text, time }) => {
    if (currentChat === from || currentChat === myName) {
      addMessage(from, text, time);
    }
    // Обновляем последнее сообщение в контактах
    renderContacts();
  });

  function addMessage(from, text, time) {
    const div = document.createElement('div');
    div.className = `msg ${from === myName ? 'me' : 'them'}`;
    div.innerHTML = `${text}<span class="time">${time}</span>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // Рендер контактов
  function renderContacts() {
    if (!contactsDiv) return;
    contactsDiv.innerHTML = '';
    allUsers.forEach(name => {
      const div = document.createElement('div');
      div.className = 'contact';
      const avatar = name.charAt(0).toUpperCase();
      div.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="info">
          <div class="name">${name}</div>
          <div class="lastMsg">Нажмите для чата</div>
        </div>
      `;
      div.addEventListener('click', () => openChat(name));
      contactsDiv.appendChild(div);
    });
  }

  // Открыть диалог
  function openChat(name) {
    currentChat = name;
    contactsDiv.classList.add('hidden');
    chatWindow.style.display = 'flex';
    backBtn.style.display = 'block';
    headerTitle.textContent = name;
    headerStatus.textContent = 'личный чат';
    messagesDiv.innerHTML = '';
    socket.emit('getHistory', { withUser: name });
    input.focus();
  }

  // Назад к контактам
  backBtn.addEventListener('click', () => {
    currentChat = '';
    chatWindow.style.display = 'none';
    contactsDiv.classList.remove('hidden');
    backBtn.style.display = 'none';
    headerTitle.textContent = 'Контакты';
    headerStatus.textContent = '';
  });

  // Отправка сообщения
  btn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  function send() {
    const text = input.value.trim();
    if (!text || !currentChat) return;
    socket.emit('sendPrivate', { to: currentChat, text });
    input.value = '';
    input.focus();
  }
</script>
</body>
</html>
